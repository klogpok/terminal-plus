<button
  #gear
  type="button"
  class="settings-button"
  aria-controls="dp-settings-panel"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="strings.settings.label"
  [title]="strings.settings.label"
  (click)="toggle()"
><span aria-hidden="true">⚙</span></button>
@if (open()) {
  <div id="dp-settings-panel" class="settings-panel" role="group" [attr.aria-label]="strings.settings.label">
    <div class="setting">
      <span class="setting-label" id="dp-settings-language">{{ strings.uiLanguage.label }}</span>
      <div class="ui-language" role="group" aria-labelledby="dp-settings-language">
        @for (language of uiLanguages; track language) {
          <button
            type="button"
            [attr.data-ui-language]="language"
            [attr.lang]="language"
            [attr.aria-pressed]="language === activeUiLanguage"
            (click)="chooseUiLanguage(language)"
          >{{ strings.uiLanguage.names[language] }}</button>
        }
      </div>
    </div>
    <div class="setting">
      <span class="setting-label" id="dp-settings-theme">{{ strings.theme.label }}</span>
      <div class="theme-switch" role="group" aria-labelledby="dp-settings-theme">
        @for (choice of themes; track choice) {
          <button
            type="button"
            [attr.data-theme-choice]="choice"
            [attr.aria-pressed]="choice === theme.theme()"
            [attr.aria-label]="strings.theme.names[choice]"
            [title]="strings.theme.names[choice]"
            (click)="theme.choose(choice)"
          ><span aria-hidden="true">{{ themeIcons[choice] }}</span></button>
        }
      </div>
    </div>
    <div class="setting-check">
      <input
        type="checkbox"
        id="dp-settings-open-tab"
        data-setting="openTabOnStart"
        aria-describedby="dp-settings-open-tab-hint"
        [checked]="openTabOnStart.enabled()"
        (change)="chooseOpenTabOnStart($event)"
      />
      <label for="dp-settings-open-tab">{{ strings.openTabOnStart.label }}</label>
      <span class="setting-hint" id="dp-settings-open-tab-hint">{{ strings.openTabOnStart.hint }}</span>
    </div>
    <div class="setting-check">
      <input
        type="checkbox"
        id="dp-settings-close-without-asking"
        data-setting="closeWithoutAsking"
        aria-describedby="dp-settings-close-without-asking-hint"
        [checked]="closeWithoutAsking.enabled()"
        (change)="chooseCloseWithoutAsking($event)"
      />
      <label for="dp-settings-close-without-asking">{{ strings.closeWithoutAsking.label }}</label>
      <span class="setting-hint" id="dp-settings-close-without-asking-hint">{{ strings.closeWithoutAsking.hint }}</span>
    </div>
  </div>
}
