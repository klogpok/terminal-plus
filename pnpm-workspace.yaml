packages:
  - packages/*
# node-pty 1.2.0-beta.15 ships win32-x64 prebuilds; its install script only checks for them
# (and falls back to node-gyp, which needs VS build tools), so it is not needed.
# The Angular toolchain packages below ship platform binaries/prebuilds as optional
# dependencies; their install scripts only verify or rebuild them, so they are not needed either.
# electron-winstaller (pulled in by electron-builder) is the Squirrel target; DevPanel ships NSIS.
allowBuilds:
  node-pty: false
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  electron-winstaller: false
